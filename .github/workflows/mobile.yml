name: Mobile APK

# Build ứng dụng Android (mobile/) trên máy chủ GitHub và xuất bản APK
# + log build vào GitHub Release "mobile-latest" (repo công khai nên
# tải về không cần đăng nhập).
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: mobile
        run: |
          set -o pipefail
          gradle assembleDebug --build-cache --stacktrace 2>&1 | tee ../mobile-build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          cp mobile-build.log out/mobile-build.log || true
          APK=mobile/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then cp "$APK" out/hrm-ai.apk; fi
          ls -la out/

      - name: Publish APK + log to release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Mobile APK (latest)
          body: APK debug mới nhất của ứng dụng HRM AI Android + log build đi kèm.
          files: out/*
          fail_on_unmatched_files: false
