name: CI

# Kiểm tra tự động mỗi lần push lên main và mỗi Pull Request:
# - Backend Flask: cài được dependencies + biên dịch được toàn bộ mã Python (+ chạy pytest nếu đã có test)
# - Frontend React JS: cài được dependencies + build production thành công
# Mục tiêu theo docs/architecture.md mục B7: nhánh main luôn ở trạng thái chạy được để demo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Flask)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (bắt lỗi cú pháp/import cơ bản)
        run: python -m compileall -q server/app server/run.py

      - name: Run tests (chỉ khi đã có thư mục server/tests)
        working-directory: server
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "Chưa có server/tests — bỏ qua bước pytest."
          fi

  frontend:
    name: Frontend (React JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build production
        working-directory: client
        run: npm run build
