# Nginx phục vụ Frontend React (SPA) + proxy API sang Backend Flask
# File này được copy vào /etc/nginx/conf.d/default.conf trong client/Dockerfile.
# Mục tiêu: FE và BE CÙNG ORIGIN khi chạy Docker — React gọi đường dẫn tương đối
# /api/v1/... và Nginx chuyển tiếp sang service "api" cổng 5000, nên:
#   - Không tốn một round-trip CORS/preflight riêng
#   - Không phải nhúng địa chỉ backend vào bundle JS lúc build

# --- Nén gzip: giảm mạnh dung lượng JS/CSS/JSON khi truyền qua mạng ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript
           text/javascript application/xml image/svg+xml font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Giới hạn kích thước upload: CV PDF tối đa 5 MB (khớp MAX_CV_SIZE_MB phía Flask)
    # cộng biên nhỏ cho multipart overhead
    client_max_body_size 10m;

    # --- Security headers cơ bản (áp cho mọi response của server này) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Khi đưa lên HTTPS thật, bỏ comment dòng dưới:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Proxy API sang Backend Flask (service "api" trong docker-compose) ---
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Phân tích CV / tổng hợp có thể chậm hơn request thường nhưng vẫn có giới hạn rõ ràng;
        # các tác vụ AI dài phải chạy nền qua worker, không giữ kết nối này chờ.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # --- Tài nguyên tĩnh có HASH trong tên file (Vite xuất ra /assets/*-[hash].js|css) ---
    # Nội dung đổi thì tên file đổi => cache CỰC dài hạn an toàn tuyệt đối
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Giữ lại security headers vì add_header ở location ghi đè của server
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- Ảnh/font tĩnh khác (không hash) ---
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- index.html: TUYỆT ĐỐI không cache ---
    # Để mỗi lần deploy, trình duyệt luôn lấy bản HTML mới trỏ đúng chunk hash mới nhất
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- SPA fallback: mọi route phía React đều trả index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
